name: build

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code; the token they get cannot push or edit anything.
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: g++ -O3 -mavx2 -pthread -std=c++17 trace.cpp -o pathtracer -lSDL2
      - name: Render two frames, twice, and check they are identical
        run: |
          ./pathtracer --offline --demo tests/smoke.json --samples 4 --resolution 1
          test "$(ls output/frame_*.png | wc -l)" -ge 2
          mv output output_first
          ./pathtracer --offline --demo tests/smoke.json --samples 4 --resolution 1
          cmp output_first/frame_00000.png output/frame_00000.png
          cmp output_first/frame_00001.png output/frame_00001.png
      - name: Continue from frame 1 and check it matches the full render
        shell: bash
        run: |
          rm -rf output
          ./pathtracer --offline --demo tests/smoke.json --samples 4 --resolution 1 --start-frame 1
          test ! -e output/frame_00000.png
          cmp output_first/frame_00001.png output/frame_00001.png
      - name: Fixed benchmark
        run: |
          ./pathtracer --bench --samples 2 --resolution 1
          mv output output_bench
      - name: Fixed benchmark, denoised
        run: |
          ./pathtracer --bench --samples 2 --resolution 1 --denoise
          mv output output_denoised
      - name: Images match the recorded hashes
        shell: bash
        run: |
          bash tests/image_hashes.sh > actual.sha256
          cat actual.sha256
          diff tests/images_linux.sha256 actual.sha256
      - name: Keep the images if they did not match
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: images-linux
          path: |
            actual.sha256
            output_first
            output_bench
            output_denoised

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # SDL2 is kept between runs, so the build does not depend on a download
      - uses: actions/cache@v4
        with:
          path: third_party
          key: sdl2-${{ hashFiles('build_windows.bat') }}
      - name: Build
        shell: cmd
        run: build_windows.bat
      - name: Render two frames, twice, and check they are identical
        shell: bash
        run: |
          ./pathtracer.exe --offline --demo tests/smoke.json --samples 4 --resolution 1
          test "$(ls output/frame_*.png | wc -l)" -ge 2
          mv output output_first
          ./pathtracer.exe --offline --demo tests/smoke.json --samples 4 --resolution 1
          cmp output_first/frame_00000.png output/frame_00000.png
          cmp output_first/frame_00001.png output/frame_00001.png
      - name: Continue from frame 1 and check it matches the full render
        shell: bash
        run: |
          rm -rf output
          ./pathtracer.exe --offline --demo tests/smoke.json --samples 4 --resolution 1 --start-frame 1
          test ! -e output/frame_00000.png
          cmp output_first/frame_00001.png output/frame_00001.png
      - name: Fixed benchmark
        shell: bash
        run: |
          ./pathtracer.exe --bench --samples 2 --resolution 1
          mv output output_bench
      - name: Fixed benchmark, denoised
        shell: bash
        run: |
          ./pathtracer.exe --bench --samples 2 --resolution 1 --denoise
          mv output output_denoised
      - name: Images match the recorded hashes
        shell: bash
        run: |
          bash tests/image_hashes.sh > actual.sha256
          cat actual.sha256
          diff tests/images_windows.sha256 actual.sha256
      - name: Keep the images if they did not match
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: images-windows
          path: |
            actual.sha256
            output_first
            output_bench
            output_denoised
